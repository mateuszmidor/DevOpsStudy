# ---------------------------------------------------------------------------
# MS Teams contact point (CRD: GrafanaContactPoint)
# ---------------------------------------------------------------------------
# Defines a contact point that delivers alert notifications to Microsoft
# Teams via an incoming webhook.
#
# The contact point uses "type: teams", which tells Grafana to format the
# alert payload in the Teams-compatible message card format.
#
# The webhook URL is sourced from the `contact-point-url` Secret
# (05-contact-point-url-secret.yaml), resolved at reconciliation time by
# the Grafana Operator via valuesFrom[].secretKeyRef.
#
# The notification policy (07-notification-policy.yaml) routes all alerts
# to this contact point.
# ---------------------------------------------------------------------------
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: ms-teams-contact-point
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "gitops"
  name: ms-teams-channel
  receivers:
    - type: teams
      settings: {}
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: contact-point-url
              key: url
